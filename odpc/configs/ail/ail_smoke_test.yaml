# odpc/configs/ail/ail_smoke_test_merged.yaml
# A-IL 框架冒烟测试的完整配置文件
# 该配置整合了所有子模块的配置，提供完整的端到端测试流程
# 使用极小的数据量和计算量，旨在快速验证整个 A-IL 流程的正确性

defaults:
  - demo: PegIns_EeDeltaPose
  - train: PegIns_EeDeltaPose
  - _self_

# ============================================================================
# 基础信息
# ============================================================================
project_name: "ail_smoke_test"
num_procs: 5
seed: 42
output_dir: runs/${project_name}_[now:%Y%m%d_%H%M%S]

# ============================================================================
# A-IL 主循环配置
# ============================================================================
ail_loop:
  num_cycles: 2  # A-IL 循环的总次数 (不包括 Cycle 0)
  rollout_episodes_per_cycle: 10  # 每轮策略部署收集的 episode 数量
  targeted_demos_per_cycle: 10  # 每轮生成的靶向性演示数量


# ============================================================================
# 初始演示生成配置 (用于 generate_expert_demos 阶段的 initial_states_path=None)
# ============================================================================
demo:
  num_traj: ${ail_loop.targeted_demos_per_cycle}
  traj_name: "smoke_test_traj"
  num_procs: ${num_procs}
  seed: ${seed}


# ============================================================================
# 策略训练配置
# ============================================================================
train:
  wandb_group: "AIL_Smoke_Test"
  num_envs: 5
  seed: ${seed}

  trainer: 
    total_iters: 110
    save_freq: 50
    eval_freq: 50
    log_freq: 10
    num_dataload_workers: 2

    train_dataset:
      num_traj: null

  evaluator:
    num_eval_episodes: 10
    dataset_configs: null


# ============================================================================
# 靶向性演示生成配置 (用于 generate_expert_demos 阶段的 initial_states_path!=None)
# ============================================================================
targeted_demo_generation:
  # 每个高价值状态将固定生成一个专家轨迹
  # 当前阶段，此配置可为空或包含注释
  pass

# ============================================================================
# 策略训练配置
# ============================================================================
# trainer:

# ============================================================================
# 离线分析配置 (Phase 4)
# ============================================================================
offline_analysis:
  # 每轮要识别的高价值状态数量
  num_high_value_states: ${ail_loop.targeted_demos_per_cycle}
  # 失败定位阈值
  failure_threshold: 0.9
  # 不确定性排序方法
  uncertainty_metric: "variance"
  # 多样性采样参数
  diversity_sampling_method: "random"
