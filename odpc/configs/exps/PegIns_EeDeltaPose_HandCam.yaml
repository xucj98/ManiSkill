defaults:
  - base
  - _self_
  
exp_name: "PegIns_EeDeltaPose_HandCam_HoleSize5_Demo8k"

wandb_group: "PegIns_EeDeltaPose_HandCam"

data_path: demos/PegIns_EeDeltaPose_HandCam_HoleSize5_DemoVal8k.rgb+depth.pd_ee_delta_pose.physx_cpu.compressed.h5

train_dataset:
  num_traj: 7800

model:
  visual_encoder_config:
    obs_meta:
      base_camera:
        type: rgbd
        rgb: sensor_data.base_camera.rgb
        depth: sensor_data.base_camera.depth
        shape: [1, 4, 256, 256]
        output_dim: 256
      hand_camera:
        type: rgbd
        rgb: sensor_data.hand_camera.rgb
        depth: sensor_data.hand_camera.depth
        shape: [1, 4, 256, 256]
        output_dim: 256
  noise_pred_net_config:
    global_cond_dim: 512

evaluator:
  env_configs:
    ind:
      env:
        env_kwargs:
          robot_uids: panda_peg_insertion
          clearance: 0.005

lr_scheduler:
  _target_: diffusers.optimization.get_scheduler
  name: cosine
  num_warmup_steps: 500
  num_training_steps: ${trainer.total_iters}

trainer:
  total_iters: 160010
  batch_size: 256
  save_freq: 8000
  eval_freq: 8000
  log_freq: 1000
  num_dataload_workers: 8
  use_amp: true
  amp_dtype: "float16"