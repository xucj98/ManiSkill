analyzer:
  _target_: odpc.evaluation.precision_curse.precision_curse_analyzer.PrecisionCurseAnalyzer

  name: KeyFrameFinder
  description: 探索不同的KeyFrameFinder的数据效率
  save_dir: analysis_outputs/${analyzer.name}

  # 1. 数据读取器配置
  reader:
    _target_: odpc.evaluation.precision_curse.wandb_reader.WandbReader
    entity: null
    project: ManiSkill
    use_wandb_filters: true
    # 筛选器 (OR of ANDs)
    filters:
      $or:
        - group: RandomFramesFinder
          config.data_trajs_dict.0: 200
          config.finetune_from_ckpt_path: runs/NormalizeAction/PegIns_EeDeltaPose_HandCam_HoleSize5_Demo2k_NullNormalizer_20250717_183251/checkpoints/140000.pt
        - group: DiffusionLossFinder
          config.data_trajs_dict.0: 200
          config.finetune_from_ckpt_path: runs/NormalizeAction/PegIns_EeDeltaPose_HandCam_HoleSize5_Demo2k_NullNormalizer_20250717_183251/checkpoints/140000.pt
        - group: PegIns_EeDeltaPose_Dagger
          config.data_trajs_dict.0: 200
          config.finetune_from_ckpt_path: runs/NormalizeAction/PegIns_EeDeltaPose_HandCam_HoleSize5_Demo2k_NullNormalizer_20250717_183251/checkpoints/140000.pt
    
        
        
  # 2. 数据处理器配置
  processor:
    _target_: odpc.evaluation.precision_curse.wandb_processor.WandbProcessor
    # 数据模式定义 (如何从每个运行中提取和转换关键信息)
    data_schema:
      num_data:
        source_type: config
        path_or_key: data_trajs_dict.1
        data_type: numeric
        on_missing: drop_run # drop_run, fill_value, error
        # fill_value: 0 # 如果 on_missing 是 fill_value

      group_name:
        source_type: attribute
        path_or_key: group
        data_type: string
        on_missing: drop_run # drop_run, fill_value, error
        remap:
          PegIns_EeDeltaPose_Dagger: LastFramesFinder

      metric:
        source_type: history
        path_or_key: eval/env_ind/success_once
        data_type: numeric
        on_missing: drop_run # drop_run, fill_value, error
        transform:
          _target_: odpc.evaluation.precision_curse.transforms.SequentialTransform
          transforms:
            # - _target_: odpc.evaluation.precision_curse.transforms.SeriesRemoveOutliersTransform
            #   method: max_n
            #   args:
            #     n: 1
            - _target_: odpc.evaluation.precision_curse.transforms.SeriesAggregationTransform
              method: max_n_mean # max, min, mean, median, last, first, last_n_mean, max_n_mean, min_n_mean
              args:
                n: 2
         
  # 3. 绘图器/分析器配置
  reporter:
    _target_: odpc.evaluation.precision_curse.scaling_law_reporter.ScalingLawReporter # 具体的绘图/分析逻辑类
    
    display_names_map: # 可选：用于图表标签的 field_key -> 显示名 映射
      num_data: "Number of Trajectories"
      metric: "Success Rate"

    report_metric_vs_num_data: # 配置第一组图
      title: Success Rate vs. Number of Trajectories (by KeyFrameFinder) # 图表标题模板，可用占位符
      grouping_legend_title: KeyFrameFinder

      x_axis:
        label: Number of Trajectories (N)
        transformed_label: log(ND)
        ticks: [50, 100, 200, 500, 1000]
        transform:
          _target_: odpc.evaluation.precision_curse.transforms.LogTransform
          base: 2
      
      y_axis:
        label: Success Rate
        transformed_label: log(1-SR)
        ticks: [0.3, 0.5, 0.7, 0.9, 0.95]
        transform:
          _target_: odpc.evaluation.precision_curse.transforms.LogOneMinusTransform
          base: 2
      
      plot_elements: # 定义图上画什么
        - type: scatter # 画原始数据点
          marker: o
          size: 30
          alpha: 0.7
        - type: linear_regression_fit # 可选，画回归线
          display_equation: true # 是否在图上显示拟合方程
          display_r_squared: true # 是否在图上显示回归系数
      
    output_options:
      save_dir: ${analyzer.save_dir}
      save_plots: true
      plot_format: png
      save_processed_data_csv: true # Plotter 可能也需要访问处理后的数据来保存
   